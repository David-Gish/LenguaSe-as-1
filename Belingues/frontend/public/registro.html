<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #007bff, #00c6ff);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; margin: 0;
    }

    .container {
      background: #fff; padding: 40px;
      border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      width: 350px; text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    h2 { color: #004080; margin-bottom: 20px; }

    input {
      width: 100%; padding: 12px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 8px;
      font-size: 16px; transition: 0.3s;
    }

    input:focus {
      border-color: #007bff; outline: none;
      box-shadow: 0 0 5px #007bff80;
    }

    button {
      width: 100%; padding: 12px;
      background: #007bff; color: white;
      border: none; border-radius: 8px;
      font-size: 16px; cursor: pointer;
      transition: background 0.3s;
    }

    button:hover { background: #0056b3; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Registrarse</h2>
    <form id="registerForm">
      <input type="text" id="nuevoUsuario" placeholder="Usuario nuevo" required>
      <input type="password" id="nuevaClave" placeholder="Clave nueva" required>
      <button type="submit">Registrar</button>
    </form>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = document.getElementById("nuevoUsuario").value;
      const pass = document.getElementById("nuevaClave").value;

      const response = await fetch("http://localhost:3000/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user, pass })
      });

      const data = await response.json();
      alert(data.message);

      if (data.success) {
        window.location.href = "login.html"; 
      }
    });
  </script>
</body>
</html>
