<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #004080, #007bff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      width: 350px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    h2 { color: #004080; margin-bottom: 20px; }

    input {
      width: 100%; padding: 12px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 8px;
      font-size: 16px; transition: 0.3s;
    }

    input:focus {
      border-color: #007bff; outline: none;
      box-shadow: 0 0 5px #007bff80;
    }

    button {
      width: 100%; padding: 12px;
      background: #007bff; color: white;
      border: none; border-radius: 8px;
      font-size: 16px; cursor: pointer;
      transition: background 0.3s;
    }

    button:hover { background: #0056b3; }

    .link-btn {
      margin-top: 15px;
      display: inline-block;
      color: #007bff;
      cursor: pointer;
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <input type="text" id="usuario" placeholder="Usuario" required>
      <input type="password" id="clave" placeholder="Clave" required>
      <button type="submit">Entrar</button>
    </form>
    <div class="link-btn" onclick="window.location.href='registro.html'">
      Crear cuenta
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = document.getElementById("usuario").value;
      const pass = document.getElementById("clave").value;

      const response = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user, pass })
      });

      const data = await response.json();
      if (data.success) {
        window.location.href = "cursos.html"; // redirige si es correcto
      } else {
        alert("❌ " + data.message);
      }
    });
  </script>
</body>
</html>
