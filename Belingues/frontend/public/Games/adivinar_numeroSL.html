<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego de Señas - Adivina el Número</title>
  <style>
    body {
      background-color: #87ceeb; /* azul cielo */
      color: #00ff00;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .game-card {
      background-color: #1f2833;
      border: 3px solid #00ff00;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      width: 500px;
      box-shadow: 0 0 20px #00ff00;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00ff00;
    }

    p {
      font-size: 16px;
      margin: 5px 0;
    }

    img {
      width: 150px;
      height: auto;
      border: 2px solid #00ff00;
      margin: 20px 0;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .options button, .control-buttons button {
      background-color: #0b0c10;
      border: 2px solid #00ff00;
      color: #00ff00;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .options button:hover, .control-buttons button:hover {
      background-color: #00ff00;
      color: #0b0c10;
    }

    .score {
      margin-top: 10px;
      font-weight: bold;
    }

    .control-buttons {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>Desafío Retro: Adivina el Número</h1>
    <p id="nivel">Nivel 1</p>
    <p>¿Qué número representa esta seña?</p>
    <img id="imagenSenia" src="" alt="Seña de número">
    
    <div class="options" id="opciones"></div>
    <p class="score" id="puntuacion">Puntuación: 0</p>
    <p id="intentos">Intentos restantes: 3</p>
  <script src="../adivina-dado.js"></script>

</body>
</html>
