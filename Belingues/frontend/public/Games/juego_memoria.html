<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧠 Juego de Memoria de Señas</title>
  <style>
    :root {
      --fondo: #f0f4f8;
      --tarjeta: #ffffff;
      --borde: #00b4d8;
      --texto: #2c3e50;
      --fondo-claro: #ecf0f1;
      --error: #e74c3c;
      --sombra: 0 4px 12px rgba(0, 0, 0, 0.15);
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #a8edea, #fed6e3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: var(--texto);
      margin: 20px 0 10px;
      font-size: 2.5rem;
      text-shadow: 1px 1px 2px #fff;
    }

    #fallos {
      font-size: 18px;
      color: var(--error);
      margin-bottom: 20px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 120px);
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      width: 120px;
      height: 120px;
      background-color: var(--tarjeta);
      border: 2px solid var(--borde);
      border-radius: 20px;
      box-shadow: var(--sombra);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.5s ease;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .card img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
    }

    .card.flipped img {
      display: block;
    }

    .card.flipped {
      background-color: var(--fondo-claro);
      transform: rotateY(180deg);
    }

    .buttons {
      display: flex;
      gap: 15px;
    }

    .buttons button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background-color: var(--borde);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .buttons button:hover {
      background-color: #0096c7;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>🧠 Juego de Memoria de Señas</h1>
  <div id="fallos">Fallos: 0 de 4</div>

  <div class="grid" id="grid"></div>


  <script>
    let attempts = 0;
    const maxIntentos = 4;
    const fallosText = document.getElementById('fallos');

    const signsOriginal = [
      'a.png', 'b.png', 'h.png','c.png', 'd.png', 'n.png', 
      'a.png', 'b.png', 'h.png','c.png', 'd.png','n.png'
    ];

    const grid = document.getElementById('grid');
    let cards = [];
    let firstCard = null;
    let lock = false;

    function actualizarContadorFallos() {
      fallosText.textContent = `Fallos: ${attempts} de ${maxIntentos}`;
    }

    function inicializarJuego() {
      grid.innerHTML = '';
      cards = [];
      firstCard = null;
      lock = false;
      attempts = 0;
      actualizarContadorFallos();

      const signs = [...signsOriginal];
      signs.sort(() => 0.5 - Math.random());

      signs.forEach(src => {
        const card = document.createElement('div');
        card.classList.add('card');

        const img = document.createElement('img');
        img.src = `img/${src}`;
        card.appendChild(img);

        card.addEventListener('click', () => {
          if (lock || card.classList.contains('flipped')) return;

          card.classList.add('flipped');

          if (!firstCard) {
            firstCard = card;
          } else {
            const secondCard = card;
            const firstImg = firstCard.querySelector('img').src;
            const secondImg = secondCard.querySelector('img').src;

            if (firstImg === secondImg) {
              firstCard = null;
            } else {
              lock = true;
              setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                firstCard = null;
                lock = false;
                attempts++;
                actualizarContadorFallos();

                if (attempts >= maxIntentos) {
                  alert('💥 ¡Has fallado 4 veces! El juego se reiniciará.');
                  inicializarJuego();
                }
              }, 800);
            }
          }
        });

        grid.appendChild(card);
        cards.push(card);
      });
    }


    inicializarJuego();
  </script>
</body>
</html>
