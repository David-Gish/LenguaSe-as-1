<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trivia - Lengua de Señas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      background: #4CAF50;
      color: white;
      padding: 15px;
      margin: 0;
    }
    #trivia {
      margin: 30px auto;
      padding: 20px;
      max-width: 600px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #2196F3;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0b7dda;
    }
    #resultado {
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>❓ Trivia: Lengua de Señas Colombiana</h1>

  <div id="trivia">
    <p id="pregunta"></p>
    <div id="opciones"></div>
    <p id="resultado"></p>
  </div>

  <script>
    const preguntas = [
      {
        pregunta: "¿En qué año se reconoció oficialmente la Lengua de Señas Colombiana?",
        opciones: ["1996", "2005", "2010"],
        respuesta: "1996"
      },
      {
        pregunta: "¿Qué institución regula la educación para personas sordas en Colombia?",
        opciones: ["ICFES", "MEN", "ICBF"],
        respuesta: "MEN"
      },
      {
        pregunta: "La LSC es considerada:",
        opciones: ["Un dialecto", "Una lengua", "Un gesto"],
        respuesta: "Una lengua"
      }
    ];

    let indice = 0;

    function cargarPregunta() {
      let p = preguntas[indice];
      document.getElementById("pregunta").innerText = p.pregunta;
      let opcionesHTML = "";
      p.opciones.forEach(op => {
        opcionesHTML += `<button onclick="verificar('${op}')">${op}</button><br>`;
      });
      document.getElementById("opciones").innerHTML = opcionesHTML;
      document.getElementById("resultado").innerText = "";
    }

    function verificar(opcion) {
      let p = preguntas[indice];
      if(opcion === p.respuesta) {
        document.getElementById("resultado").innerText = "✅ Correcto!";
      } else {
        document.getElementById("resultado").innerText = "❌ Incorrecto. La respuesta era: " + p.respuesta;
      }
      indice = (indice + 1) % preguntas.length;
      setTimeout(cargarPregunta, 2000);
    }

    cargarPregunta();
  </script>
</body>
</html>
