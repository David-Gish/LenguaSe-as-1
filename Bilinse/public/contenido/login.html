<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="../estilos/registro.css">
  <script>
    function login(event) {
      event.preventDefault();
      const user = document.getElementById("usuario").value;
      const pass = document.getElementById("clave").value;

      // Lista de usuarios válidos por defecto
      const usuariosValidos = [
        { usuario: "admin", clave: "1234" },
        { usuario: "estudiante", clave: "5678" },
        { usuario: "profesor", clave: "abcd" }
      ];

      // Recuperar usuario registrado desde localStorage (si existe)
      const usuarioGuardado = JSON.parse(localStorage.getItem("usuario"));

      if (usuarioGuardado) {
        usuariosValidos.push({ usuario: usuarioGuardado.correo, clave: usuarioGuardado.clave });
      }

      // Verificar credenciales
      const valido = usuariosValidos.find(u => u.usuario === user && u.clave === pass);

      if (valido) {
        alert("✅ Bienvenido " + user);
        window.location.href = "cursos.html"; 
      } else {
        alert("❌ Usuario o clave incorrectos");
      }
    }
  </script>
</head>
<body>
  <section class="login-box">
    <h2>Iniciar Sesión</h2>
    <form onsubmit="login(event)">
      <label for="usuario">Usuario:</label>
      <input type="text" id="usuario" required>

      <label for="clave">Contraseña:</label>
      <input type="password" id="clave" required>

      <button type="submit">Entrar</button>
    </form>

    <p>¿No tienes cuenta?</p>
    <button onclick="window.location.href='registro.html'">Crear cuenta</button>
  </section>
</body>
</html>
