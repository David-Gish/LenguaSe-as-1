<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Examen: Lengua de Señas</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #e3f2fd, #ede7f6);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease-in-out;
    }
    h1 {
      color: #1a237e;
      margin-bottom: 20px;
    }
    .question img {
      max-width: 200px;
      margin: 15px auto;
      border: 3px solid #1a237e;
      border-radius: 15px;
      padding: 5px;
      background: #e8eaf6;
    }
    .options button {
      display: block;
      margin: 12px auto;
      padding: 12px;
      width: 70%;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #3949ab;
      transition: all 0.3s ease;
    }
    .options button:hover { background: #303f9f; }
    .options button.correct { background: #2e7d32 !important; }
    .options button.wrong { background: #c62828 !important; }
    #submitBtn {
      margin-top: 25px;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      background: #0288d1;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    #submitBtn:hover { background: #0277bd; }
    .nav-btn {
      margin-top: 25px;
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      background: #0066cc;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }
    .nav-btn:hover { background: #004d99; }
    #scoreText {
      margin-top: 20px;
      font-size: 20px;
      color: #1a237e;
      font-weight: bold;
    }
    .attempts {
      margin: 15px;
      font-size: 18px;
      color: #333;
      font-weight: bold;
    }
    .dot {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin: 3px;
      border-radius: 50%;
      background: #0288d1;
    }
    .dot.used { background: #b0bec5; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Examen: Abecedario en Lengua de Señas</h1>
    <div class="question" id="questionBox"></div>
    <div class="options" id="optionsBox"></div>
    <button id="submitBtn">Enviar Respuesta</button>
    <p class="attempts" id="attemptsBox"></p>
    <p id="scoreText"></p>
    <a href="curso.html" class="nav-btn">⬅ Volver al curso</a>
  </div>

  <script>
    const questions = [
      {img: "./assets/signs/a.png", answer: "A"},
      {img: "./assets/signs/b.png", answer: "B"},
      {img: "./assets/signs/d.png", answer: "D"},
      {img: "./assets/signs/e.png", answer: "E"},
      {img: "./assets/signs/h.png", answer: "H"}
    ];

    let current = 0;
    let score = 0;
    let attempts = 0;
    const maxAttempts = 5;
    let selectedAnswer = null;

    const qBox = document.getElementById("questionBox");
    const oBox = document.getElementById("optionsBox");
    const submitBtn = document.getElementById("submitBtn");
    const scoreText = document.getElementById("scoreText");
    const attemptsBox = document.getElementById("attemptsBox");

    function renderAttempts() {
      attemptsBox.innerHTML = "Intentos: ";
      for (let i = 0; i < maxAttempts; i++) {
        const dot = document.createElement("span");
        dot.classList.add("dot");
        if (i < attempts) dot.classList.add("used");
        attemptsBox.appendChild(dot);
      }
    }

    function renderQuestion(){
      let q = questions[current];
      qBox.innerHTML = `<img src="${q.img}" alt="Seña"> <p>Selecciona la letra que representa esta seña:</p>`;
      oBox.innerHTML = "";
      selectedAnswer = null;
      let opts = shuffle(["A","B","C","D","E","F","G","H"]).slice(0,3);
      if(!opts.includes(q.answer)) opts[0] = q.answer;
      opts = shuffle(opts);
      opts.forEach(opt=>{
        let btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = ()=>{
          Array.from(oBox.children).forEach(b=>b.style.opacity="0.6");
          btn.style.opacity="1";
          selectedAnswer = opt;
        };
        oBox.appendChild(btn);
      });
      renderAttempts();
    }

    submitBtn.onclick = ()=>{
      if(!selectedAnswer){
        alert("Debes seleccionar una opción antes de enviar.");
        return;
      }

      attempts++;
      let q = questions[current];
      if(selectedAnswer === q.answer){
        score++;
      }

      if(attempts >= maxAttempts){
        alert(`Has llegado al límite de intentos (${maxAttempts}). Examen terminado.`);
        qBox.innerHTML = "<h2>Examen finalizado 📘</h2>";
        oBox.innerHTML = "";
        submitBtn.disabled = true;
        scoreText.textContent = `Puntaje final: ${score}/${questions.length}`;
        return;
      }

      current++;
      if(current >= questions.length){
        qBox.innerHTML = "<h2>¡Has completado el examen! 🎉</h2>";
        oBox.innerHTML = "";
        submitBtn.disabled = true;
        scoreText.textContent = `Puntaje final: ${score}/${questions.length}`;
      } else {
        renderQuestion();
        scoreText.textContent = `Puntaje: ${score}/${questions.length}`;
      }
    }

    function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

    renderQuestion();
  </script>
</body>
</html>
