<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Examen: Lengua de Señas</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 850px;
      margin: 20px;
      padding: 30px;
      background: rgba(255,255,255,0.9);
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      animation: fadeIn 1s ease-in-out;
    }
    h1 {
      color: #311b92;
      margin-bottom: 25px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }
    .question img {
      max-width: 220px;
      margin: 20px auto;
      border: 4px solid #311b92;
      border-radius: 20px;
      padding: 6px;
      background: #ede7f6;
      transition: transform 0.3s ease;
    }
    .question img:hover {
      transform: scale(1.05);
    }
    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }
    .options button {
      padding: 14px 22px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #3949ab, #5c6bc0);
      transition: all 0.3s ease;
      min-width: 80px;
    }
    .options button:hover { 
      background: linear-gradient(135deg, #303f9f, #3949ab);
      transform: scale(1.05);
    }
    #submitBtn, #retryBtn {
      margin-top: 25px;
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.3s ease;
      display: inline-block;
    }
    #submitBtn:hover, #retryBtn:hover { 
      transform: scale(1.05);
    }
    .nav-btn {
      margin-top: 30px;
      display: inline-block;
      padding: 14px 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #00b09b, #96c93d);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: transform 0.3s ease;
    }
    .nav-btn:hover { transform: scale(1.05); }
    #scoreText {
      margin-top: 20px;
      font-size: 22px;
      color: #1a237e;
      font-weight: bold;
    }
    .attempts {
      margin: 15px;
      font-size: 18px;
      color: #333;
      font-weight: bold;
    }
    .dot {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin: 3px;
      border-radius: 50%;
      background: #0288d1;
    }
    .dot.used { background: #b0bec5; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Examen: Abecedario en Lengua de Señas</h1>
    <div class="question" id="questionBox"></div>
    <div class="options" id="optionsBox"></div>
    <button id="submitBtn">Enviar Respuesta</button>
    <button id="retryBtn" style="display:none;">🔄 Volver a Intentar</button>
    <p class="attempts" id="attemptsBox"></p>
    <p id="scoreText"></p>
    <a href="../cursos.html" class="nav-btn">⬅ Volver al curso</a>
  </div>

  <script>
    const questions = [
      {img: "../assets/a.png", answer: "A"},
      {img: "../assets/b.png", answer: "B"},
      {img: "../assets/d.png", answer: "D"},
      {img: "../assets/e.png", answer: "E"},
      {img: "../assets/h.png", answer: "H"}
    ];

    let current = 0;
    let score = 0;
    let attempts = 0;
    const maxAttempts = 5;
    let selectedAnswer = null;

    const qBox = document.getElementById("questionBox");
    const oBox = document.getElementById("optionsBox");
    const submitBtn = document.getElementById("submitBtn");
    const retryBtn = document.getElementById("retryBtn");
    const scoreText = document.getElementById("scoreText");
    const attemptsBox = document.getElementById("attemptsBox");

    function renderAttempts() {
      attemptsBox.innerHTML = "Intentos: ";
      for (let i = 0; i < maxAttempts; i++) {
        const dot = document.createElement("span");
        dot.classList.add("dot");
        if (i < attempts) dot.classList.add("used");
        attemptsBox.appendChild(dot);
      }
    }

    function renderQuestion(){
      let q = questions[current];
      qBox.innerHTML = `<img src="${q.img}" alt="Seña"> <p>Selecciona la letra que representa esta seña:</p>`;
      oBox.innerHTML = "";
      selectedAnswer = null;
      let opts = shuffle(["A","B","C","D","E","F","G","H"]).slice(0,3);
      if(!opts.includes(q.answer)) opts[0] = q.answer;
      opts = shuffle(opts);
      opts.forEach(opt=>{
        let btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = ()=>{
          Array.from(oBox.children).forEach(b=>b.style.opacity="0.6");
          btn.style.opacity="1";
          selectedAnswer = opt;
        };
        oBox.appendChild(btn);
      });
      renderAttempts();
    }

    submitBtn.onclick = ()=>{
      if(!selectedAnswer){
        alert("Debes seleccionar una opción antes de enviar.");
        return;
      }

      attempts++;
      let q = questions[current];
      if(selectedAnswer === q.answer){
        score++;
      }

      if(attempts >= maxAttempts || current >= questions.length-1){
        qBox.innerHTML = "<h2>Examen finalizado 📘</h2>";
        oBox.innerHTML = "";
        submitBtn.style.display = "none";
        retryBtn.style.display = "inline-block";
        scoreText.textContent = `Puntaje final: ${score}/${questions.length}`;
        return;
      }

      current++;
      renderQuestion();
      scoreText.textContent = `Puntaje: ${score}/${questions.length}`;
    }

    retryBtn.onclick = ()=>{
      // Reiniciar variables
      current = 0;
      score = 0;
      attempts = 0;
      submitBtn.style.display = "inline-block";
      retryBtn.style.display = "none";
      scoreText.textContent = "";
      renderQuestion();
    }

    function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

    renderQuestion();
  </script>
</body>
</html>
