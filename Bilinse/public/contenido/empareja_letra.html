<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Empareja la letra con la seña</title>
  <style>
    body {
      font-family: "Press Start 2P", cursive;
      background: linear-gradient(135deg, #ffb6c1, #ffd6e0, #c1e1ff);
      text-align: center;
      margin: 0;
      padding: 0;
      color: #333;
    }

    h1 {
      background: #ff69b4;
      color: white;
      padding: 20px;
      margin: 0;
      font-size: 18px;
      letter-spacing: 2px;
      text-shadow: 2px 2px #ff1493;
    }

    #juego {
      margin: 30px auto;
      padding: 20px;
      max-width: 700px;
      background: #fff0f5;
      border: 4px solid #ff69b4;
      border-radius: 20px;
      box-shadow: 0 0 15px #ffb6c1;
    }

    #seña {
      margin: 20px auto;
      width: 200px;
      height: 200px;
      border: 3px solid #ff69b4;
      border-radius: 15px;
      background: #ffe4e1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #seña img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .opciones {
      margin-top: 20px;
    }

    .opciones button {
      display: inline-block;
      margin: 10px;
      padding: 15px 25px;
      font-size: 16px;
      border: 3px solid #ff69b4;
      border-radius: 12px;
      background: #fff;
      color: #ff1493;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 3px 3px #ff69b4;
    }

    .opciones button:hover {
      background: #ffb6c1;
      color: white;
      transform: scale(1.1);
    }

    #resultado {
      font-size: 16px;
      margin-top: 15px;
      font-weight: bold;
    }

    .correcto {
      color: green;
    }

    .incorrecto {
      color: red;
    }

    #marcador {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    #timer {
      font-size: 16px;
      margin-top: 15px;
      color: #ff1493;
      font-weight: bold;
    }

    #reiniciar {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 14px;
      border-radius: 10px;
      border: 3px solid #ff69b4;
      background: #ffb6c1;
      color: white;
      cursor: pointer;
      display: none;
    }

    /* Fuente retro kawaii */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  </style>
</head>
<body>
  <h1>🎀 Juego 1: Empareja la letra con la seña 🎀</h1>

  <div id="juego">
    <div id="seña">
      <img id="imagenSeña" src="" alt="Seña">
    </div>

    <div class="opciones" id="opciones"></div>

    <p id="resultado"></p>
    <p id="marcador">✅ Aciertos: 0 | ❌ Errores: 0</p>
    <p id="timer">⏳ Tiempo: 10:00</p>
    <button id="reiniciar" onclick="reiniciarJuego()">🔄 Volver a intentar</button>
  </div>

  <script>
     const señas = [
      { letra: "A", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR631n3bt2Yhs7ckTE4RgU5VTHtr-zAp2mELFKd7y_cg7K6VG4fGYXMV_oz6htSRdfGPDs&usqp=CAU" },
      { letra: "B", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwuv8Wh_laJpmqzR9LF8ZX1FLhAaUrnOqLWg&s" },
      { letra: "C", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4cPP-qERaAgGApsOEUjsALlRfj5CwAKucDSdF55dMKP1-jtQcqEVT46otK2hA3_Egds4&usqp=CAU" },
      { letra: "D", imagen: "https://static.vecteezy.com/system/resources/previews/002/594/410/non_2x/sign-language-hand-gesture-indicating-d-letter-line-icon-free-vector.jpg" },
      { letra: "E", imagen: "https://w7.pngwing.com/pngs/571/262/png-transparent-american-sign-language-american-manual-alphabet-letter-fingerspelling-american-sign-language-s-english-face-monochrome.png" },
      { letra: "F", imagen: "https://static.vecteezy.com/system/resources/previews/003/228/503/non_2x/hand-sign-language-alphabet-letter-f-illustration-vector.jpg" },
      { letra: "G", imagen: "https://images.vexels.com/media/users/3/164153/isolated/lists/06aa6f39535c7551febc3e40399d758f-mano-dedo-g-letra-g-plano.png" },
      { letra: "H", imagen: "https://images.vexels.com/media/users/3/164165/isolated/preview/39f12476d86a6d3b0bc11f4cc8e54cdf-mano-dedo-h-letra-h-trazo.png" },
      { letra: "I", imagen: "https://thumbs.dreamstime.com/b/ortograf%C3%ADa-de-dedo-en-el-alfabeto-lenguaje-signos-estadounidense-tambi%C3%A9n-la-letra-i-vector-icono-con-estilo-plano-aislado-fondo-179429969.jpg" },
      { letra: "J", imagen: "https://st.depositphotos.com/1029434/4866/v/950/depositphotos_48669323-stock-illustration-sign-language-and-the-alphabetthe.jpg" },
      { letra: "K", imagen: "https://w7.pngwing.com/pngs/487/961/png-transparent-american-sign-language-k-fingerspelling-finger-miscellaneous-white-english.png" },
      { letra: "L", imagen: "https://i.pinimg.com/474x/a6/92/3b/a6923b8fb9e830a197648cbab4aa679c.jpg" },
      { letra: "M", imagen: "https://img.freepik.com/fotos-premium/letra-n-lenguaje-senas-americano-asl-personas-sordas_568886-885.jpg" },
      { letra: "N", imagen: "https://previews.123rf.com/images/alexfernandezch/alexfernandezch2010/alexfernandezch201000032/156575422-letter-n-of-the-alphabet-of-sign-language-isolated-on-white-background.jpg" },
      { letra: "Ñ", imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSyK27jMCiRf1cEQ09qEFWhe0YjRYiL9Awcug&s" },
      { letra: "O", imagen: "https://images.vexels.com/media/users/3/164212/isolated/preview/f6de198899dc985d7ff98b1d9f579b15-mano-dedo-o-letra-o-ilustracion.png" },
      { letra: "P", imagen: "https://us.123rf.com/450wm/givasika/givasika2004/givasika200400031/144774977-el-dibujo-de-una-mano-humana-p-es-la-decimosexta-letra-del-alfabeto-en-lenguaje-de-se%C3%B1as-la-letra.jpg?ver=6" },
      { letra: "Q", imagen: "https://images.freeimages.com/vhq/images/previews/98f/sign-language-q-clip-art-80587.jpg" },
      { letra: "R", imagen: "https://images.vexels.com/media/users/3/164244/isolated/preview/60c614e04e6e4e3460f4a0ba9cde630b-mano-dedo-r-letra-r-ilustracion.png" },
      { letra: "S", imagen: "https://st.depositphotos.com/1029434/4866/v/950/depositphotos_48668345-stock-illustration-sign-language-and-the-alphabetthe.jpg" },
      { letra: "T", imagen: "https://static.vecteezy.com/system/resources/previews/003/228/481/non_2x/hand-sign-language-alphabet-letter-t-illustration-vector.jpg" },
      { letra: "U", imagen: "https://static.vecteezy.com/system/resources/previews/002/594/536/non_2x/sign-language-hand-gesture-indicating-u-letter-line-and-fill-icon-free-vector.jpg" },
      { letra: "V", imagen: "https://images.vexels.com/media/users/3/164257/isolated/preview/a42b9d1939bbe77156e20ba8253423f6-mano-dedo-v-letra-v-ilustracion.png" },
      { letra: "W", imagen: "https://st3.depositphotos.com/26063720/36429/v/450/depositphotos_364299606-stock-illustration-w-is-the-twenty-third.jpg" },
      { letra: "X", imagen: "https://st.depositphotos.com/1029434/4866/v/950/depositphotos_48667785-stock-illustration-sign-language-and-the-alphabetthe.jpg" },
      { letra: "Y", imagen: "https://static.vecteezy.com/system/resources/previews/003/228/494/non_2x/hand-sign-language-alphabet-letter-y-illustration-vector.jpg" },
      { letra: "Z", imagen: "https://st.depositphotos.com/1029434/4866/v/950/depositphotos_48667701-stock-illustration-sign-language-and-the-alphabetthe.jpg" }
    ];


    let actual = 0;
    let aciertos = 0;
    let errores = 0;
    let tiempoRestante = 600; // 10 minutos en segundos
    let temporizador;

    function cargarJuego() {
      if (tiempoRestante <= 0) return;

      let s = señas[actual];
      document.getElementById("imagenSeña").src = s.imagen;

      let letras = señas.map(item => item.letra).sort(() => Math.random() - 0.5);

      let opcionesHTML = "";
      letras.forEach(l => {
        opcionesHTML += `<button onclick="verificar('${l}')">${l}</button>`;
      });

      document.getElementById("opciones").innerHTML = opcionesHTML;
      document.getElementById("resultado").innerText = "";
    }

    function verificar(letra) {
      let correcta = señas[actual].letra;
      if (letra === correcta) {
        aciertos++;
        document.getElementById("resultado").innerHTML = "✅ Correcto!";
        document.getElementById("resultado").className = "correcto";
      } else {
        errores++;
        document.getElementById("resultado").innerHTML = "❌ Incorrecto. Era " + correcta;
        document.getElementById("resultado").className = "incorrecto";
      }

      document.getElementById("marcador").innerText = `✅ Aciertos: ${aciertos} | ❌ Errores: ${errores}`;

      actual = (actual + 1) % señas.length;
      setTimeout(cargarJuego, 1500);
    }

    function iniciarTemporizador() {
      temporizador = setInterval(() => {
        if (tiempoRestante <= 0) {
          clearInterval(temporizador);
          document.getElementById("resultado").innerText = "⏳ Se acabó el tiempo!";
          document.getElementById("opciones").innerHTML = "";
          document.getElementById("reiniciar").style.display = "inline-block";
          return;
        }
        tiempoRestante--;
        let min = Math.floor(tiempoRestante / 60);
        let seg = tiempoRestante % 60;
        document.getElementById("timer").innerText = `⏳ Tiempo: ${min}:${seg < 10 ? "0" + seg : seg}`;
      }, 1000);
    }

    function reiniciarJuego() {
      aciertos = 0;
      errores = 0;
      actual = 0;
      tiempoRestante = 600;
      document.getElementById("reiniciar").style.display = "none";
      document.getElementById("marcador").innerText = "✅ Aciertos: 0 | ❌ Errores: 0";
      document.getElementById("timer").innerText = "⏳ Tiempo: 10:00";
      cargarJuego();
      iniciarTemporizador();
    }

    cargarJuego();
    iniciarTemporizador();
  </script>
</body>
</html>
